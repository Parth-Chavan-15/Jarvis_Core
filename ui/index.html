<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis | Local Command Center</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --jarvis-cyan: #00f3ff;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #112233 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .main-container {
            width: 95%;
            max-width: 1400px;
            height: 85vh;
            display: flex;
            gap: 20px;
        }

        .vision-panel {
            flex: 1;
            background: #000;
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .vision-header {
            padding: 15px;
            background: rgba(0,0,0,0.8);
            position: absolute;
            top: 0; width: 100%;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--jarvis-cyan);
            text-transform: uppercase;
        }

        .input_video { display: none; } 
        .output_canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        .terminal-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: var(--jarvis-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--jarvis-cyan);
            transition: all 0.3s ease;
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }
        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.2); border-radius: 3px; }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-right-radius: 2px;
        }
        .message.jarvis {
            align-self: flex-start;
            background-color: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-bottom-left-radius: 2px;
            color: var(--jarvis-cyan);
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 15px;
        }
        input[type="text"] {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 15px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--jarvis-cyan);
        }
        button {
            background: transparent;
            border: 1px solid var(--jarvis-cyan);
            color: var(--jarvis-cyan);
            padding: 0 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        button:hover {
            background: var(--jarvis-cyan);
            color: black;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .btn-stop {
            border-color: #ff4444;
            color: #ff4444;
            padding: 8px 15px;
            font-size: 0.8rem;
        }
        .btn-stop:hover {
            background: #ff4444;
            color: white;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
        }
        .typing-indicator {
            align-self: flex-start;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
            padding-left: 10px;
        }
        /* NEW: Siri/Google Assistant Pulsing Orb Effect */
        @keyframes listenPulse {
            0% { transform: scale(1); box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
            50% { transform: scale(1.6); box-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 60px #ff0055; }
            100% { transform: scale(1); box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        }
        .status-dot.listening-mode {
            background-color: #ff0055 !important;
            animation: listenPulse 1.2s infinite ease-in-out !important;
        }
    </style>
</head>
<body>
    <div class="main-container">
        
        <div class="vision-panel">
            <div class="vision-header">Optic Sensor: Active</div>
            <video class="input_video"></video>
            <canvas class="output_canvas" width="640" height="480"></canvas>
        </div>

        <div class="terminal-panel">
            <div class="header">
                <div class="header-left">
                    <div class="status-dot" id="status-dot"></div>
                    <h1>Jarvis Core Terminal</h1>
                </div>
                <button class="btn-stop" onclick="stopJarvis()">⏹ Stop Jarvis</button>
            </div>

            <div class="chat-container" id="chat-container">
                <div class="message jarvis">System initialized. Awaiting voice, text, or visual input.</div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type command sequence..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Transmit</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. YOUR EXISTING TERMINAL LOGIC
        // ==========================================
        async function stopJarvis() {
            await fetch('/api/stop', { method: 'POST' });
        }

        setInterval(async () => {
            try {
                const response = await fetch("/api/status");
                const data = await response.json();
                
                // DOT UI UPDATE
                const dot = document.getElementById('status-dot');
                dot.className = 'status-dot'; // Reset class
                
                if (data.state === 'idle') {
                    dot.style.backgroundColor = 'var(--jarvis-cyan)';
                    dot.style.boxShadow = '0 0 10px var(--jarvis-cyan)';
                    dot.style.transform = 'scale(1)';
                } else if (data.state === 'listening') {
                    // THE FIX: Apply the pulsating orb class
                    dot.classList.add('listening-mode');
                } else if (data.state === 'processing') {
                    dot.style.backgroundColor = '#ffbb33'; 
                    dot.style.boxShadow = '0 0 15px #ffbb33';
                    dot.style.transform = 'scale(1)';
                } else if (data.state === 'speaking') {
                    dot.style.backgroundColor = '#00C851'; 
                    dot.style.boxShadow = '0 0 15px #00C851';
                    dot.style.transform = 'scale(1)';
                }

                // NEW FEATURE: IF PYTHON ASKS FOR A PICTURE, SNAP IT AND SEND IT BACK!
                // NEW FEATURE: IF PYTHON ASKS FOR A PICTURE, SNAP IT AND SEND IT BACK!
                if (data.vision_prompt) {
                    
                    // THE FIX: Check if the camera heartbeat has flatlined (older than 2 seconds)
                    const isCameraFrozen = (Date.now() - lastCameraUpdate) > 2000;

                    if (document.hidden || isCameraFrozen) {
                        console.warn("Sensor is frozen or browser is backgrounded. Cancelling.");
                        fetch("/api/vision_failed", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ error: "camera_frozen" })
                        });
                    } else {
                        console.log("Python requested a frame! Snapping picture...");
                        const image_b64 = canvasElement.toDataURL('image/jpeg', 0.8);
                        
                        fetch("/api/vision", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ prompt: data.vision_prompt, image_b64: image_b64 })
                        });
                    }
                }

                if (data.logs && data.logs.length > 0) {
                    const chatContainer = document.getElementById("chat-container");
                    data.logs.forEach(log => {
                        const userMsgDiv = document.createElement("div");
                        userMsgDiv.className = "message user";
                        userMsgDiv.textContent = `🎤 ${log.user}`;
                        chatContainer.appendChild(userMsgDiv);

                        const jarvisMsgDiv = document.createElement("div");
                        jarvisMsgDiv.className = "message jarvis";
                        jarvisMsgDiv.textContent = log.jarvis;
                        chatContainer.appendChild(jarvisMsgDiv);
                    });
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (error) {
                document.getElementById('status-dot').style.backgroundColor = '#555';
            }
        }, 800);

        function handleKeyPress(event) {
            if (event.key === "Enter") { sendMessage(); }
        }

        async function sendMessage(textOverride = null, isGesture = false) {
            const inputField = document.getElementById("user-input");
            const message = textOverride || inputField.value.trim();
            if (!message) return;
            
            const chatContainer = document.getElementById("chat-container");
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            
            if (isGesture) {
                userMsgDiv.innerHTML = `🖐️ <i>Gesture: ${message}</i>`;
            } else {
                userMsgDiv.textContent = `⌨️ ${message}`;
                inputField.value = "";
            }
            chatContainer.appendChild(userMsgDiv);
            
            const typingDiv = document.createElement("div");
            typingDiv.className = "typing-indicator";
            typingDiv.id = "loading";
            typingDiv.textContent = "Processing logic...";
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                document.getElementById("loading").remove();
                
                const jarvisMsgDiv = document.createElement("div");
                jarvisMsgDiv.className = "message jarvis";
                jarvisMsgDiv.textContent = data.reply;
                chatContainer.appendChild(jarvisMsgDiv);
            } catch (error) {
                document.getElementById("loading").remove();
                const errorMsgDiv = document.createElement("div");
                errorMsgDiv.className = "message jarvis";
                errorMsgDiv.style.color = "#ff4444";
                errorMsgDiv.textContent = "Error: Connection to AI Core failed.";
                chatContainer.appendChild(errorMsgDiv);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }


        // ==========================================
        // 2. THE NEW VISION & GESTURE SYSTEM
        // ==========================================
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');

        let lastGestureTime = 0;
        let lastCameraUpdate = 0; // THE FIX: Tracks the exact millisecond the camera last worked

        function checkGestures(landmarks) {
            // THE UPGRADE: True 3D Spatial Distance Formula (x, y, and z axes)
            const getDist3D = (p1, p2) => Math.sqrt(
                Math.pow(p1.x - p2.x, 2) + 
                Math.pow(p1.y - p2.y, 2) + 
                Math.pow(p1.z - p2.z, 2)
            );

            // Calculate finger states using 3D depth
            const indexUp = getDist3D(landmarks[0], landmarks[8]) > 1.5 * getDist3D(landmarks[0], landmarks[5]);
            const middleUp = getDist3D(landmarks[0], landmarks[12]) > 1.5 * getDist3D(landmarks[0], landmarks[9]);
            const ringUp = getDist3D(landmarks[0], landmarks[16]) > 1.5 * getDist3D(landmarks[0], landmarks[13]);
            const pinkyUp = getDist3D(landmarks[0], landmarks[20]) > 1.5 * getDist3D(landmarks[0], landmarks[17]);
            
            const thumbOut = getDist3D(landmarks[4], landmarks[17]) > 1.2 * getDist3D(landmarks[2], landmarks[17]);

            let detectedCommand = null;

            // STRICT LOGIC MATRIX: It now explicitly checks every single finger for every gesture
            if (indexUp && middleUp && ringUp && pinkyUp && thumbOut) {
                // ALL 5 FINGERS: True Open Palm
                detectedCommand = "open notepad";
            } 
            else if (indexUp && middleUp && !ringUp && !pinkyUp && !thumbOut) {
                // ONLY INDEX & MIDDLE: Strict Peace Sign (Thumb and others must be tucked)
                detectedCommand = "open chrome";
            }
            else if (!indexUp && !middleUp && !ringUp && !pinkyUp && thumbOut) {
                // ONLY THUMB: Strict Thumbs Up
                detectedCommand = "open spotify";
            }

            if (detectedCommand) {
                const now = Date.now();
                if (now - lastGestureTime > 5000) { 
                    lastGestureTime = now;
                    sendMessage(detectedCommand, true); 
                }
            }
        }

        function onResults(results) {
            // THE FIX: The camera is alive! Update the heartbeat timestamp.
            lastCameraUpdate = Date.now();

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00f3ff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1});
                    checkGestures(landmarks);
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
